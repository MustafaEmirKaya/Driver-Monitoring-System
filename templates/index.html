<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç İzleme</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <header style="background-color: #0f172a; border-bottom: 1px solid #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <h1 style="font-size: 1.25rem; font-weight: bold;">Araç İzleme <span style="color: #818cf8; font-weight: 300;"></span></h1>
        </div>
    </header>

    <main style="flex: 1; padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        
        <!--sol taraf-->
        <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <div style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; position: relative;">
                <div style="width: 100%; aspect-ratio: 16/9; background-color: #020617; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                    <img id="video-stream" src="http://localhost:8000/video_feed" style="width: 100%; height: 100%; object-fit: cover;" alt="Kamera Bekleniyor...">
                </div>
            </div>

            <!-- Anlık Durum -->
            <div id="status-banner" style="background-color: rgba(6, 78, 59, 0.4); border: 1px solid rgba(5, 150, 105, 0.6); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div>
                        <p style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase;">Sürücü Durumuu</p>
                        <h2 id="status-text" style="font-size: 1.1rem; font-weight: 700; color: #34d399;">Normal</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- sağ taraf -->
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
                <h3 style="font-size: 0.85rem; font-weight: 600; color: #cbd5e1; text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">Oturum İstatistikleri</h3>
                
               
                <div style="background-color: rgba(2, 6, 23, 0.6); border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-size: 0.75rem; color: #94a3b8;">Uyuklama Sayısı</p>
                        <p id="val-uyuklama" style="font-size: 1.5rem; font-weight: 900; color: #ffffff;">0</p>
                    </div>
                </div>

                <!-- Esneme  -->
                <div style="background-color: rgba(2, 6, 23, 0.6); border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-size: 0.75rem; color: #94a3b8;">Esneme Sayısı</p>
                        <p id="val-esneme" style="font-size: 1.5rem; font-weight: 900; color: #ffffff;">0</p>
                    </div>
                </div>

                <!-- Kafa Durumu  -->
                <div style="background-color: rgba(2, 6, 23, 0.6); border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-size: 0.75rem; color: #94a3b8;">Kafa Yönelimi</p>
                        <p id="val-kafa" style="font-size: 0.95rem; font-weight: 700; color: #a5b4fc;">Merkez (Normal)</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws/telemetry");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            document.getElementById("val-uyuklama").innerText = data.sleep_count;
            document.getElementById("val-esneme").innerText = data.yawn_count;
            document.getElementById("val-kafa").innerText = data.kafa_durumu;
            
            const statusText = document.getElementById("status-text");
            const statusBanner = document.getElementById("status-banner");
            const statusDot = document.getElementById("status-dot");
            
            statusText.innerText = data.status;

            if (data.status.includes("KRITIK")) {
                statusBanner.style.backgroundColor = "rgba(127, 29, 29, 0.4)";
                statusText.style.color = "#fca5a5";
                statusDot.style.backgroundColor = "#ef4444";
            } else if (data.status.includes("DIKKAT") || data.status.includes("UYARI")) {
                statusBanner.style.backgroundColor = "rgba(120, 53, 15, 0.4)";
                statusText.style.color = "#fcd34d";
                statusDot.style.backgroundColor = "#f59e0b";
            } else {
                statusBanner.style.backgroundColor = "rgba(6, 78, 59, 0.4)";
                statusText.style.color = "#34d399";
                statusDot.style.backgroundColor = "#10b981";
            }
        };
    </script>
</html>
